name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # BASE_PATH is only needed while the site lives at
      # amitnz-web.github.io/covercheck-nz. Once cover.amit.marketing is pointed
      # here, clear BASE_PATH and set SITE_ORIGIN to the custom domain.
      - name: Build
        env:
          BASE_PATH: covercheck-nz
          SITE_ORIGIN: https://amitnz-web.github.io
        run: node build.mjs

      # The compliance and link rules are part of the deploy gate, not a local
      # nicety — a regression here must fail the build rather than ship.
      - name: Verify
        env:
          BASE_PATH: covercheck-nz
        run: node verify.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
